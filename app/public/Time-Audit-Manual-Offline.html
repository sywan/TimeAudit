load high-resolution logo PNG",note:"A good start: record for 3\u20137 days before interpreting the charts. Sleep, rest, and unrecorded gaps are part of the picture.",sections:[{id:"start",number:"01",title:"Get started",lead:"Choose where your data should live.",items:[{title:"Sign in with Google",body:"Choose a Google account on the welcome screen. After signing in, use Authorize sync at the top and grant Google Drive access. Cross-device sync starts only after that authorization. If a later session shows Drive disconnected, authorize it again."},{title:"Preview mode",body:"Use Preview to explore first. Preview data stays in this browser, cannot sync through Drive, and can disappear if browser storage is cleared."},{title:"Install on your device",body:"On iPhone, open the site in Safari and choose Share \u2192 Add to Home Screen. In Chrome or Edge, use the address bar or browser menu to install. Drive sync still needs internet and authorization."}]},{id:"record",number:"02",title:"Record your day",lead:"Log the activity you actually did and adjust the time freely.",items:[{title:"Add a time block",body:"On Today, add an entry and adjust its start and end. The default interval is only a starting point. A long sleep can be entered as one block."},{title:"Choose an activity",body:"Pick a frequent activity or search the catalog. Categories help you browse; each saved activity has its own ID. Teaching / course preparation is under Work. Choose Other to add a new activity, then change its category in Settings if needed."},{title:"Quick ratings",body:"Optionally rate how you felt during the activity, then its importance, urgency, and alignment with your values. Each scale runs from 1 to 7, with higher meaning more. Skip any uncertain rating; add a description or link values and goals only when helpful."},{title:"Backfill and edit",body:"The Calendar shows entries and gaps. Open a day to fill missed time or edit an entry. On Today, swipe left to move forward one day and right to move back; desktop users can use the date arrows."}]},{id:"journal",number:"03",title:"Keep a daily journal",lead:"Let the timeline prompt a more personal reflection.",items:[{title:"Summary and mood",body:"The journal on Today includes an automatically updated activity summary. Add your own note and, if you wish, a 1\u20137 daily mood rating. Your note saves automatically."},{title:"Dictation",body:"Tap the microphone and speak. If speech recognition is unavailable in your browser or home-screen app, use the microphone on your phone keyboard instead. Review the transcribed text before leaving."}]},{id:"insights",number:"04",title:"Read the insights",lead:"Charts use actual duration, not the number of entries.",items:[{title:"Choose a window",body:"Insights supports today, the last 3, 7, or 30 days, six months, and one year. Reflection has adjustable ranges too. Check data quality and unrecorded hours before interpreting other charts."},{title:"Allocation and rhythm",body:"Time allocation shows duration by category. The weekly rhythm covers seven days and 24 hours, and the boundary view compares recorded work with the hours you set."},{title:"Ratings and feelings",body:"Explore time spent across importance, urgency, and value alignment ratings, plus exploratory links between activity feelings and daily mood. Unrated and unrecorded time stay visible. These are prompts for reflection, not diagnoses."}]},{id:"reflect",number:"05",title:"Turn reflection into action",lead:"Try one small change each week and observe what happens.",items:[{title:"Review evidence cards",body:"Reflection highlights time-weighted patterns and weekly review cards. Open the source entries to judge whether a pattern fits your experience, then mark cards that were useful."},{title:"Run an if\u2013then experiment",body:"Write one concrete plan, such as \u201CIf I start watching a show after dinner, then I will read for ten minutes first.\u201D Compare records before and after, then keep or revise the plan."},{title:"Values and goals",body:"Create your own values and goals in Settings and link them to entries when useful. Goal time depends on available links or recognizable data; zero minutes does not necessarily mean zero effort."}]},{id:"data",number:"06",title:"Sync, backup, and privacy",lead:"Keep an extra copy of what matters to you.",items:[{title:"Check sync",body:"After Google Drive authorization, use the sync button in the top bar. A progress indicator appears. Before switching devices, make sure both have synchronized. Data is stored locally and, when authorized, in your own Google Drive app files."},{title:"Export regularly",body:"Download a JSON backup from Settings, especially before changing devices or making major edits. CSV is available for spreadsheet analysis. JSON import is also in Settings."},{title:"More settings",body:"Switch between Traditional Chinese and English, change font and sidebar size, set reminders while the browser is open, manage activity categories, take the optional IPIP-50, and check for updates."}]}]}};function fS(){let[a,e]=(0,Xo.useState)(()=>{try{return localStorage.getItem("timeAuditLocale")==="en"?"en":"zh-TW"}catch{return"zh-TW"}}),t=uS[a],l=n=>{e(n);try{localStorage.setItem("timeAuditLocale",n)}catch{}document.documentElement.lang=n==="zh-TW"?"zh-Hant":"en",document.title=`${n==="zh-TW"?"\u4F7F\u7528\u624B\u518A":"User guide"} \xB7 Time Audit`},u="./",f=window.__TA_OFFLINE_ASSETS__,o=n=>f?.[n]??`${u}${n}`,d=f?"https://sywan.github.io/TimeAudit/":u;return(0,C.jsxs)("div",{className:"manual-page",children:[(0,C.jsxs)("header",{className:"manual-top",children:[(0,C.jsxs)("a",{className:"manual-brand",href:d,"aria-label":"Time Audit",children:[(0,C.jsx)("img",{src:o("logo-v108.svg"),alt:""}),(0,C.jsx)("strong",{children:"Time Audit"}),(0,C.jsx)("span",{children:"GUIDE"})]}),(0,C.jsxs)("div",{className:"manual-actions",children:[(0,C.jsxs)("div",{className:"manual-language","aria-label":"Language",children:[(0,
